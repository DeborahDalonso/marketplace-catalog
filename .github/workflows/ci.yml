name: ci

on:
    push:
        branches: [main, develop]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping -h localhost -proot"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 20

        env:
            MYSQL_HOST: 127.0.0.1
            MYSQL_PORT: 3306
            MYSQL_USER: root
            MYSQL_PASSWORD: root

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run lint

            - run: npm test
